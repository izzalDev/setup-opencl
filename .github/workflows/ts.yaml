name: ts

on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - "*.json"
      - "*.yaml"
      - .github/workflows/ts.yaml
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - "*.json"
      - "*.yaml"
      - .github/workflows/ts.yaml

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v6
      - run: pnpm i
      - run: pnpm run test
      - run: pnpm run build

      - name: Run local action
        uses: ./
